<dialog id="review-new-dialog" class="detail-dialog" aria-label="新增评测案例"><div class="dialog-top"><h2>新增待人工复核案例</h2><button class="icon-button" type="button" data-close aria-label="关闭">×</button></div><p>仅填写已支持的申请字段，不填写姓名、身份证号码、银行卡或其他身份标识。此处不预填结论。</p><form id="review-new-form" class="review-form"><label>案例编号<input id="new-case-id" required pattern="[a-zA-Z0-9][a-zA-Z0-9_.-]{2,119}" maxlength="120" placeholder="例如：hz-eval-new-001"></label><label>案例标题<input id="new-case-title" required maxlength="200"></label><label>对应政策<select id="new-case-policy" required></select></label><label>案例来源<select id="new-case-origin"><option value="user_authored_synthetic">新编合成案例</option><option value="deidentified_case">已脱敏案例</option></select></label><label>既往开发使用情况<select id="new-case-training"><option value="unknown">尚未确认</option><option value="not_used">我确认未用于训练、调参或模型选择</option><option value="used">已用于开发，只作开发检查</option></select></label><label>申请字段 JSON<textarea id="new-case-profile" rows="12" required spellcheck="false"></textarea></label><p class="field-note">空白字段用 null。新编号不代表新案例；与已有开发数据完全相同的人物字段会被测试用途检查拦截。</p><div id="new-case-error" class="form-error" role="alert" hidden></div><button class="btn btn-primary" type="submit">建立待复核草稿</button></form></dialog>
